ds(`Quando o governo não responde à autorização na mesma hora, o que o sistema recebe e o que precisa fazer em seguida?~Recebe um recibo do lote enviado e precisa consultar o resultado mais tarde.~recibo|consult,verific,busca|lote,assincron,processamento

  else if(new Set(ws).size/n<.6)why="Evite repetir palavras: explique o raciocínio com mais variedade.";
  else if(ws.filter(w=>toks.some(k=>!k.includes(" ")&&hit(w,k))).length/n>.65)why="A resposta parece uma lista de palavras-chave; explique as relações entre os conceitos.";

  if(S.ans)return;clearInterval(tmr);
  const q=G[S.p][S.i],ok=k>=0&&q.o[k]==q.a;
  done(ok,(ok?"✅ Correto! +1 ponto.":(k<0?"⏰ Tempo esgotado. ":"❌ ")+(S.mode==="train"?"Resposta de referência: <b>"+LET[q.o.indexOf(q.a)]+") "+q.a+"</b>":"Resposta não exibida no modo certificação.")));
  document.querySelectorAll(".o").forEach((b,j)=>{if(q.o[j]==q.a)b.classList.add("ok");else if(j==k)b.classList.add("er")});
}
function sendD(){
  if(S.ans)return;clearInterval(tmr);
  const a=document.getElementById("ans"),q=G[S.p][S.i];
  S.txt=a?a.value:"";
  const r=grade(q,S.txt);
  done(r.ok,(r.ok?"✅ Resposta aceita. ":(r.sf?"❌ Resposta ainda insuficiente. ":"❌ "+r.why+" "))+`Critérios atendidos: ${r.h} de ${r.n} (mínimo ${need(q)}).`+(S.mode==="train"?`<br><b>Resposta de referência:</b> ${esc(q.m)}`:""),r);
}
function next(){
  if(S.lives==0){S.view="end";return show()}
  S.i++;
  if(S.i>9){if(S.p==4){S.won=true;S.view="end";SFX.win()}else S.view="phase";return show()}
  nq();
}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t=="dark":matchMedia("(prefers-color-scheme: dark)").matches};
function ic(){document.getElementById("tg").textContent=isDark()?"☀️":"🌙"}
function tgl(){const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("th",t)}catch(e){}ic()}
try{const t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t}catch(e){}
ic();show();loadRank();
</script>
