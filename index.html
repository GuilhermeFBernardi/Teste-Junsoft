try{LOC=JSON.parse(localStorage.getItem("rk")||"[]")}catch(e){}
// sorteia 10 das 20 perguntas de cada nível e embaralha perguntas e alternativas (N1 3 alternativas ... N5 7)
const build=()=>[0,1,2,3,4].map(l=>sh(D[2*l].concat(D[2*l+1])).slice(0,10).map(q=>({q:q.q.replace(/^CHEFE( FINAL)?: /,""),a:q.a,e:q.e,o:sh([q.a,...sh(q.d).slice(0,l+2)])})));
const fresh=()=>{G=build();S={p:0,i:0,lives:V,score:0,ans:false,hits:0,tot:0,view:"intro",saved:false,won:false,time:0,t0:0,left:60,w:0,c:99}};
fresh();
function tone(f,d,t,v,dl){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(dl||0);o.type=t||"sine";o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v||.15,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const SFX={
ok:()=>{tone(660,.12,"triangle",.2);tone(880,.22,"triangle",.2,.1)},
err:()=>{tone(220,.25,"sawtooth",.13);tone(160,.3,"sawtooth",.13,.15)},
warn:()=>{tone(520,.15,"square",.09);tone(520,.15,"square",.09,.22)},
tick:()=>tone(900,.12,"square",.11),
lose:()=>[400,330,260,170].forEach((f,k)=>tone(f,.4,"sawtooth",.14,k*.28)),
start:()=>[523,659,784,1047].forEach((f,k)=>tone(f,.22,"triangle",.17,k*.12)),
win:()=>[523,659,784,1047,784,1047,1319].forEach((f,k)=>tone(f,.25,"triangle",.17,k*.13))};
function start(){fresh();S.view="q";SFX.start();nq();loadRank()}
const url=()=>FB.replace(/\/$/,"")+"/ranking.json";
async function loadRank(){
  const loc=()=>{RK=LOC.slice().sort(cmp).slice(0,10);rkLocal=true};
  if(FB){try{const r=await fetch(url());if(!r.ok)throw 0;const o=await r.json()||{};RK=Object.values(o).sort(cmp).slice(0,10);rkLocal=false}catch(e){loc()}}
  else loc();
  if(S.view=="intro"||(S.view=="end"&&S.saved))show();
}
function rankHTML(){
  if(RK===undefined)return"<p>Carregando ranking…</p>";
  const note=rkLocal?`<p><small>${FB?"Sem conexão com o ranking online; mostrando o salvo neste navegador.":"Ranking salvo só neste navegador."}</small></p>`:"";
  if(!RK.length)return"<p>Ninguém no ranking ainda. Seja o primeiro!</p>"+note;
  return note+`<table><tr><th>#</th><th>Nome</th><th>Pontos</th><th>Tempo</th></tr>${RK.map((r,k)=>`<tr><td>${k+1}</td><td>${esc(r.name)} <small>· fase ${esc(r.phase)}</small></td><td>${esc(r.score)}</td><td>${fmt(r.time||0)}</td></tr>`).join("")}</table><p><small>Mais pontos fica na frente; em empate de pontos, vence o menor tempo total.</small></p>`;
}
async function save(){
  const n=document.getElementById("nm").value.trim().slice(0,20);
  if(!n){document.getElementById("msg").textContent="Digite um nome.";return}
  if(S.saved)return;
  const r={name:n,score:S.score,time:Math.round(S.time),hits:S.hits,phase:S.p+1,t:Date.now()};
  let ok=false;
  if(FB)try{ok=(await fetch(url(),{method:"POST",body:JSON.stringify(r)})).ok}catch(e){}
  if(!ok){LOC.push(r);try{localStorage.setItem("rk",JSON.stringify(LOC))}catch(e){}}
  S.saved=true;await loadRank();show();
}
function head(){
  return`<div class="card"><div class="top"><span>Nível ${NV[S.p]} · pergunta ${S.i+1}/10</span><span>⭐ ${S.score} pts</span><span>${"❤️".repeat(S.lives)}${"🖤".repeat(V-S.lives)}</span></div><div class="bar"><i style="width:${(S.p*10+S.i)*2}%"></i></div></div>`;
}
function show(){
  if(S.view=="intro"){
    $.innerHTML=`<div class="card"><h1>🧭 A Jornada do Implantador</h1><p>50 perguntas sobre o JunsoftERP em 5 níveis de 10 perguntas, sorteadas de um banco de 100 a cada jogo. Cada pergunta vale 1 ponto.</p><p>De N1 a N5 aumentam as alternativas (3 a 7) e diminui o tempo por pergunta (60s, 50s, 40s, 30s e 20s). Se o tempo acabar, conta como erro. Você tem <b>5 vidas para a jornada inteira</b>. No fim, registre seu nome: mais pontos fica na frente e, em empate, vence o menor tempo total.</p><button class="b" onclick="start()">Começar</button></div><div class="card"><h2>🏆 Top 10</h2>${rankHTML()}</div>`;return}
  if(S.view=="phase"){
    $.innerHTML=`<div class="card"><h2>✅ Nível ${NV[S.p]} concluído</h2><p class="big">${S.score} pts</p><p>Tempo total: ${fmt(S.time)} · Vidas: ${"❤️".repeat(S.lives)}</p><button class="b" onclick="S.p++;S.i=0;SFX.start();nq()">Próximo: ${NV[S.p+1]} (${G[S.p+1][0].o.length} alternativas, ${LV[S.p+1]}s)</button></div>`;return}
  if(S.view=="end"){
    $.innerHTML=`<div class="card"><h2>${S.won?"🏆 Jornada concluída! Você é Lenda da Implantação":"💥 Fim das vidas no nível "+NV[S.p]}</h2><p class="big">${S.score} pts</p><p>Tempo total: ${fmt(S.time)} · Acertos: ${S.hits} de ${S.tot}</p>`+
    (S.saved?"":`<p>Registre seu nome no ranking:</p><input id="nm" maxlength="20" placeholder="Seu nome"> <button class="b" onclick="save()">Salvar</button><p id="msg" class="fb"></p>`)+
    `<button class="g" onclick="start()">Jogar de novo</button></div><div class="card"><h2>🏆 Top 10</h2>${rankHTML()}</div>`;
    if(RK===undefined)loadRank();return}
  const q=G[S.p][S.i];
  $.innerHTML=`<div class="side"><div>Tempo total<b id="ct">${fmt(S.time)}</b></div><div>Restante<b id="cr">${Math.ceil(S.left)}s</b></div></div>`+head()+`<div class="card"><div class="bar"><i id="tb" style="width:${S.left/LIM()*100}%;background:var(--er)"></i></div><h2>${q.q}</h2>`+
  q.o.map((o,k)=>`<button class="o" ${S.ans?"disabled":""} onclick="pick(${k})">${o}</button>`).join("")+`<div id="fb" class="fb"></div></div>`;
}
function upd(){
  const g=id=>document.getElementById(id),L=S.left,c=Math.ceil(L);
  if(g("cr"))g("cr").textContent=c+"s";
  if(g("ct"))g("ct").textContent=fmt(S.ans?S.time:S.time+(LIM()-L));
  if(g("tb"))g("tb").style.width=(L/LIM()*100)+"%";
  let d=g("cd");
  if(!S.ans&&L>0&&c<=3){if(!d){d=document.createElement("div");d.id="cd";d.className="cd";document.body.appendChild(d)}d.textContent=c}else if(d)d.remove();
}
function startT(){
  clearInterval(tmr);S.t0=Date.now();S.left=LIM();S.w=0;S.c=99;
  tmr=setInterval(()=>{
    S.left=Math.max(0,LIM()-(Date.now()-S.t0)/1000);upd();
    const c=Math.ceil(S.left);
    if(S.left<=10&&!S.w){S.w=1;SFX.warn()}
    if(c<=3&&c>0&&c!=S.c){S.c=c;SFX.tick()}
    if(S.left<=0)pick(-1);
  },200);
}
function nq(){S.view="q";S.ans=false;S.left=LIM();show();startT()}
function pick(k){
  if(S.ans)return;
  clearInterval(tmr);
  const q=G[S.p][S.i],ok=k>=0&&q.o[k]==q.a;
  S.time+=Math.min(LIM(),(Date.now()-S.t0)/1000);
  S.ans=true;S.tot++;
  if(ok){S.score++;S.hits++;SFX.ok()}else{S.lives--;S.lives==0?SFX.lose():SFX.err()}
  show();upd();
  document.querySelectorAll(".o").forEach((b,j)=>{if(q.o[j]==q.a)b.classList.add("ok");else if(j==k)b.classList.add("er")});
  document.getElementById("fb").innerHTML=(ok?"✅ Correto! +1 ponto. ":(k<0?"⏰ Tempo esgotado. ":"❌ ")+"Resposta: <b>"+q.a+"</b>. ")+q.e+`<br><button class="b" onclick="next()">Continuar</button>`;
}
function next(){
  if(S.lives==0){S.view="end";return show()}
  S.i++;
  if(S.i>9){if(S.p==4){S.won=true;S.view="end";SFX.win()}else S.view="phase";return show()}
  nq();
}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t=="dark":matchMedia("(prefers-color-scheme: dark)").matches};
function ic(){document.getElementById("tg").textContent=isDark()?"☀️":"🌙"}
function tgl(){const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("th",t)}catch(e){}ic()}
try{const t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t}catch(e){}
ic();show();loadRank();
</script>
</body>
</html>
