const nz=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const mc=s=>s.trim().split("\n").map(l=>{const f=l.split("|");return{q:f[0],a:f[1],d:f[2].split(";")}});
const ds=s=>s.trim().split("\n").map(l=>{const f=l.split("~");return{q:f[0],m:f[1],g:f[2].split("|").map(x=>x.split(",").map(k=>nz(k.trim())))}});

Qual módulo cuida do cadastro de usuários e das permissões de acesso?|Administração|Fiscal;Estoque;Pedidos;Faturamento
Qual módulo trata das ordens de serviço e da manutenção de equipamentos?|Ordens de Serviço|Pedidos de compra;Contábil;Frente de Caixa;Captação de leite
Qual módulo cuida dos pedidos de venda e de compra?|Pedidos|Fiscal;Contábil;Administração;Recapagem
Cite dois produtos do Portal do Cliente da Junsoft além do JunsoftERP.|Portal de Chamados e Portal Web|Facebook e Instagram;Excel e Word;Firebird e Delphi;Gmail e Google Agenda
Qual módulo cuida de fretes, entregas e documentos de transporte?|Transporte|Estoque;Contábil;Financeiro;Administração
Qual módulo cuida da operação de caixa, PIX e sangria?|Frente de Caixa (PDV)|Contábil;Fiscal;Pedidos;Administração
Para que serve o Portal de Chamados?|Abrir e acompanhar chamados de suporte|Emitir notas fiscais;Cadastrar produtos;Receber boletos;Controlar o estoque
Qual módulo lida com impostos e obrigações enviadas ao governo, como o SPED?|Fiscal|Estoque;Pedidos;Transporte;Frente de Caixa`),
mc(`Que tipos de nota fiscal o PDV (venda de balcão) pode emitir?|NFC-e ou SAT|NF-e de entrada ou CT-e;NFS-e ou MDF-e;Boleto ou duplicata;Nota de transferência ou DANFE

O que acontece automaticamente no financeiro quando uma nota de venda é emitida?|Geração dos títulos a receber|Geração de contas a pagar;Nada, é manual;Cancelamento do pedido;Emissão de CT-e
Qual a diferença entre nota de saída e nota de entrada? Dê um exemplo de cada.|Saída: mercadoria sai (ex.: venda). Entrada: mercadoria entra (ex.: compra)|Saída: compra. Entrada: venda;Saída só para devolução e entrada só para serviço;Não há diferença entre elas;Saída é do PDV e entrada é do portal
Além da venda, que outros tipos de nota de saída o sistema permite emitir?|Devolução, transferência e remessa|Somente venda;Apenas serviço;Só boleto;Somente cupom
Por que uma devolução de mercadoria é registrada como uma nota fiscal?|Porque a mercadoria que volta precisa ser documentada fiscalmente|Para gerar boleto;Só por costume interno;Para dar desconto;Porque o cliente exige cupom
Para que serve a tabela de preços no faturamento?|Definir o preço dos itens por tabela ou condição|Controlar o limite de crédito;Calcular comissão;Gerar a chave de acesso;Definir a série

O que é a comissão de um vendedor e em qual módulo ela é controlada?|Percentual pago ao vendedor sobre a venda, controlado em Vendas|Desconto dado ao cliente, controlado no Fiscal;Imposto sobre a venda, controlado no Financeiro;Frete cobrado, controlado em Transporte;Taxa de cartão, controlada no Caixa
O que é uma nota em rascunho, ou seja, ainda não emitida?|Nota digitada mas ainda não transmitida|Nota cancelada;Nota autorizada pelo governo;Nota excluída definitivamente;Nota de transferência

Qual a diferença entre o ambiente de testes (homologação) e o de produção?|Homologação é teste sem valor fiscal e produção é real|Os dois são iguais;Produção é teste e homologação é real;Homologação só vale para NFC-e;Produção é só para cancelamentos
Para que serve o certificado digital na emissão de notas?|Assinar digitalmente a nota|Calcular impostos;Gerar boletos;Baixar estoque;Cadastrar clientes
O que é a “série” de uma nota fiscal?|Subdivisão que organiza a numeração das notas|Cor do DANFE;Tipo de imposto;Código do cliente;Forma de pagamento
O que identifica a chave de acesso de uma nota e quantos dígitos ela tem?|Identifica a nota de forma única, com 44 dígitos|Identifica o cliente, com 11 dígitos;Identifica o produto, com 8 dígitos;Identifica o vendedor, com 14 dígitos;Identifica a série, com 3 dígitos

Para que servem as bibliotecas compartilhadas (Shared), como o jFaturamento?|Reaproveitar regras comuns entre vários módulos|Guardar backups;Imprimir relatórios;Controlar o caixa;Cadastrar usuários`),
ds(`Quando o governo não responde à autorização na mesma hora, o que o sistema recebe e o que precisa fazer em seguida?~Recebe um recibo do lote enviado e precisa consultar o resultado mais tarde.~recibo|consult,verific,busca|lote,assincron,processamento
Quando uma nota é emitida, o que o sistema pode fazer automaticamente com os boletos dos títulos a receber?~Gerar os boletos automaticamente a partir das parcelas, se isso estiver ativado na configuração da série.~gera,cria,imprime|parcela|serie,configur,parametro
Por que o sistema guarda os dados eletrônicos da nota (protocolo, XML) separados dos dados comerciais?~Porque são dados fiscais e técnicos, diferentes da parte comercial; separar facilita auditoria, reenvio e organização.~fiscal,eletronic,tecnic|comercial,negocio|auditor,reenvi,organiz,separa
Onde fica guardado o arquivo da nota depois que ela é autorizada?~O XML autorizado, com o protocolo, fica armazenado no banco de dados do sistema.~xml|banco,pasta,diretorio,armazen|protocolo,autoriz
Como o sistema calcula os impostos de cada item e de quais informações ele depende?~Por item, usando NCM, natureza da operação, situação tributária e estados de origem e destino, conforme as regras cadastradas.~ncm|natureza,cfop,operacao|estado,uf,origem,destino|situacao tribut,cst,csosn,regra
O que é substituição tributária e como o sistema lida com ela?~O ICMS é recolhido antecipadamente por um substituto para toda a cadeia; o sistema calcula base e valor do ST por item conforme a regra (MVA).~antecip,cadeia,substitut|base,mva,st|item,calcul,regra
O que significa ratear o frete entre os itens da nota?~Distribuir o valor do frete proporcionalmente entre os itens, por valor ou peso, compondo o total de cada item.~distribu,divid,proporcion,rate|item|valor,peso
Descreva a conta que o sistema faz para chegar ao valor total de um item da nota, usando as operações matemáticas envolvidas.~Multiplica a quantidade pelo preço, subtrai o desconto e soma o frete e as despesas.~multipl,vezes|subtra,menos,abate|soma,mais,acresc|despesa,frete,desconto
Como o sistema sabe que um pedido já foi faturado?~Grava no pedido a quantidade faturada de cada item e o vínculo com a nota, atualizando a situação do pedido.~vincul,relaciona,refer|quantidade,item,saldo|situac,status,fatur
O que significa, na prática, cada situação de uma nota no sistema: rascunho, pendente, válida, cancelada e excluída?~Rascunho: ainda em edição e não enviada. Pendente: enviada e aguardando resposta. Válida: autorizada pelo governo. Cancelada: anulada por um evento. Excluída: apagada antes de ser emitida.~edic,digit,nao enviad,nao foi enviad,nao transmit|sem resposta,aguard,esper,nao confirm|autoriz,aprovad,aceit|anulad,desfeit,evento|removid,apagad,descartad,nunca emitid
O que acontece quando o serviço do governo está fora do ar no momento da emissão?~A nota fica pendente para reenvio ou é emitida em contingência.~contingencia|pendente,aguard,espera|reenvi,tent,volta,depois
Em que situação se usa o cancelamento e em que situação se usa a inutilização?~Cancelamento anula uma nota que já foi autorizada. Inutilização informa à SEFAZ um número que nunca foi usado em nenhuma nota.~autorizada,ja aprovad,ja emitid|numero,numeracao,sequencia|nunca,nao usad,pulad,sem uso|sefaz,governo,informar,comunic
Para que serve a Carta de Correção e quais informações da nota ela não pode alterar?~Serve para corrigir erros em campos da nota sem cancelá-la, mas não pode mudar valores, impostos, destinatário nem data.~evento,sefaz,sem cancel,registra|valor,imposto,preco,base|destinat,cliente,cnpj|data,emissao
Como o sistema pode impedir temporariamente a emissão de novas notas?~Por parâmetro de bloqueio de emissão, na série ou na configuração.~bloque,impedir,travar|serie,parametro,configur,emiss
É possível editar uma nota depois de emitida? Em que condições?~Autorizada não se edita: só corrige por Carta de Correção ou cancela e emite outra. Rascunho ou nota reaberta pode ser editada.~nao,autorizada|carta,cancel|rascunho,reabert,pendente
Quem pode ser responsável pelo pagamento do frete na nota? Quais são as opções?~O frete pode ficar por conta do emitente (CIF), do destinatário (FOB), de terceiros ou ser sem frete.~emitente,remetente,cif|destinat,fob|terceiro|sem frete,proprio,sem ocorr
Qual a vantagem de a numeração das notas ser automática por série?~Evita números repetidos ou pulados, mantém a sequência controlada por série e reduz erro humano.~repetid,duplic|pulad,sequenc,ordem|erro,seguranca,automatic
Quais arquivos o sistema envia automaticamente por e-mail depois que a nota é autorizada, e a quem?~Envia o XML e o DANFE ao cliente (destinatário).~xml|danfe,pdf|cliente,destinat,comprador
Qual a diferença entre o certificado digital em arquivo e o certificado em cartão ou token?~O A1 é um arquivo instalado no computador; o A3 fica em cartão ou token e exige dispositivo e senha, sendo mais seguro.~a1,arquivo,pfx|a3,token,cartao|seguro,senha,dispositivo,fisico
Por que o sistema permite bloquear a emissão de notas com data retroativa?~Para manter a cronologia fiscal e evitar problemas com a SEFAZ e a escrituração.~cronolog,sequencia,ordem|fiscal,sefaz,legisl,escritur|retroativ,anterior,data`),
ds(`Descreva os passos que o sistema executa com uma nota depois que ela é digitada, até o governo autorizá-la.~Valida os dados, numera a nota, gera e assina o XML, envia à SEFAZ e recebe a autorização com o protocolo.~valid,confer|numera,numero|xml|assin|sefaz,transmit,envi|protocolo,retorno
Quais são, em ordem, as etapas técnicas que o sistema executa para enviar uma nota ao governo?~Carrega o certificado digital, gera o arquivo XML, assina o XML, valida o arquivo e envia à SEFAZ.~certificad|xml|assin|valid,schema|sefaz,webservice,transmit
Que informações formam a chave de acesso de uma nota e para que serve o dígito verificador no final?~44 dígitos com UF, data (ano e mês), CNPJ do emitente, modelo, série, número e código; o dígito verificador detecta erro de digitação.~uf,estado|cnpj|modelo,serie,numero|dv,digito verificador,verific|44
O que acontece no sistema, em cadeia, quando o governo autoriza uma nota?~Grava protocolo e XML, muda a situação para válida, baixa o estoque, gera os títulos financeiros e libera DANFE e e-mail.~protocolo,xml|valida,situacao,status|estoque|financeiro,titulo,parcela|email,danfe
O que acontece com a nota quando o governo recusa o envio ou não consegue responder por instabilidade?~Na recusa (rejeição) a nota é corrigida e reenviada; na instabilidade fica pendente para consulta posterior ou segue em contingência.~rejei,recus,erro|corrig,reenvi|pendente,consult|contingencia

Qual o prazo geral para cancelar uma nota autorizada e o que acontece se esse prazo for ultrapassado?~Em geral até 24 horas depois da autorização; passado o prazo a SEFAZ rejeita o cancelamento e é preciso seguir outro procedimento.~24|hora|rejei,recusa,nao permit,nao aceit,bloque|sefaz,estado,legisl
Se o serviço normal do governo estiver indisponível, como a empresa continua emitindo notas e o que faz quando o serviço volta?~Emite as notas em modo de contingência e, quando o serviço volta, transmite as notas e regulariza as pendências.~contingencia|transmit,reenvi,regulariz|pendenc,pendente,confer,autoriz

  return`<aside class="hof"><h2>🏅 Últimos dias</h2>${rows.length?rows.map(h=>`<div class="hw"><b>${dm(h.w)}</b>${h.t.map((r,k)=>`<div class="m${k+1}">${MED[k]} ${esc(r.name)} <small>${esc(r.score)}</small></div>`).join("")}</div>`).join(""):"<p><small>Ainda sem dias anteriores.</small></p>"}</aside>`;
}
async function save(){
  const n=document.getElementById("nm").value.trim().slice(0,20);
  if(!n){document.getElementById("msg").textContent="Digite um nome.";return}
  if(S.saved)return;
  const r={name:n,score:S.score,time:Math.round(S.time),hits:S.hits,phase:NV[S.p],t:Date.now()};
  let ok=false;
  if(FB)try{ok=await dbput("ranking/"+WK+(AUTH?"/"+U.uid:""),r)}catch(e){}
  if(!ok){LOC.push({...r,w:WK});try{localStorage.setItem("rk",JSON.stringify(LOC))}catch(e){}}
  S.saved=true;await loadRank();show();
}
async function start(){
  if(AUTH){
    if(!(U&&U.ver)){MSG="Entre com sua conta para jogar.";return show()}
    let ok=false;try{ok=await dbput("plays/"+WK+"/"+U.uid,{t:Date.now(),e:U.email})}catch(e){}
    if(!ok){MSG="Você já jogou hoje ("+dm(WK)+") ou não foi possível conectar. Volte amanhã!";return show()}
  }
  MSG="";fresh(AUTH?hs(U.uid+WK):0);SFX.start();nq();loadRank();
}
const hearts=()=>"❤️".repeat(Math.min(S.lives,V))+(S.lives>V?"🛡️":"")+"🖤".repeat(Math.max(0,V-S.lives));
function head(){
  return`<div class="card"><div class="top"><span>Nível ${NV[S.p]} · pergunta ${S.i+1}/10</span><span>⭐ ${S.score} pts</span><span>🔥 ${S.st%10}/10</span><span>${hearts()}</span></div><div class="bar"><i style="width:${(S.p*10+S.i)*2}%"></i></div></div>`;
}
function loginHTML(){
  if(!AUTH)return"";
  if(U&&U.ver)return`<div class="card"><p>Conectado como <b>${esc(U.email)}</b> · <button class="g" onclick="logout()">Sair</button></p><p><small>Cada e-mail pode jogar uma vez por dia (hoje: ${dm(WK)}).</small></p></div>`;
  return`<div class="card"><h2>🔐 Entre para jogar</h2><input id="em" type="email" placeholder="E-mail"> <input id="pw" type="password" placeholder="Senha (mín. 6 caracteres)"><br><button class="b" onclick="doLogin(0)">Entrar</button> <button class="g" onclick="doLogin(1)">Criar conta</button> ${U&&!U.ver?`<button class="g" onclick="resend()">Reenviar e-mail de verificação</button>`:""}<p class="fb">${esc(LMSG)}</p></div>`;
}
const canPlay=()=>!AUTH||(U&&U.ver);
function show(){
  if(S.view=="intro"){
    $.innerHTML=`<div class="card"><h1>🧭 A Jornada do Implantador</h1><p>50 perguntas sobre o JunsoftERP em 5 níveis de 10, sorteadas de um banco de 100. Cada jogador recebe um sorteio próprio, com perguntas, ordem e alternativas diferentes. Cada pergunta vale 1 ponto.</p><p><b>N1 e N2:</b> múltipla escolha (a–e), 60 s por pergunta. <b>N3, N4 e N5:</b> respostas descritivas, 240 s por pergunta; o sistema avalia pelos conceitos-chave citados e mostra quantos você já atendeu enquanto digita.</p><p>Você tem <b>5 vidas</b>. A cada <b>10 acertos seguidos</b> ganha 1 vida; com as 5 cheias, ganha um 🛡️ escudo (máximo de 1). O ranking é <b>diário</b> e recomeça a cada dia: mais pontos fica na frente e, em empate, o menor tempo total.</p>${MSG?`<p class="fb"><b>${esc(MSG)}</b></p>`:""}${canPlay()?`<button class="b" onclick="start()">Começar</button>`:""}</div>`+loginHTML()+`<div class="card"><h2>🏆 Top 10 de hoje (${dm(WK)})</h2>${rankHTML()}</div>`+hofHTML();return}
  if(S.view=="phase"){
    $.innerHTML=`<div class="card"><h2>✅ Nível ${NV[S.p]} concluído</h2><p class="big">${S.score} pts</p><p>Tempo total: ${fmt(S.time)} · Vidas: ${hearts()}</p><button class="b" onclick="S.p++;S.i=0;SFX.start();nq()">Próximo: ${NV[S.p+1]} (${S.p+1<2?"múltipla escolha":"resposta descritiva, 240 s"})</button></div>`;return}
  if(S.view=="end"){
    $.innerHTML=`<div class="card"><h2>${S.won?"🏆 Jornada concluída! Você é Lenda da Implantação":"💥 Fim das vidas no nível "+NV[S.p]}</h2><p class="big">${S.score} pts</p><p>Tempo total: ${fmt(S.time)} · Acertos: ${S.hits} de ${S.tot}</p>`+
    (S.saved?"":`<p>Registre seu nome no ranking de hoje:</p><input id="nm" maxlength="20" placeholder="Seu nome"> <button class="b" onclick="save()">Salvar</button><p id="msg" class="fb"></p>`)+
    (AUTH?`<p><small>Seu próximo jogo será amanhã.</small></p>`:`<button class="g" onclick="start()">Jogar de novo</button>`)+`</div><div class="card"><h2>🏆 Top 10 de hoje (${dm(WK)})</h2>${rankHTML()}</div>`+hofHTML();
    if(RK===undefined)loadRank();return}
  const q=G[S.p][S.i];
  $.innerHTML=`<div class="side"><div>Tempo total<b id="ct">${fmt(S.time)}</b></div><div>Restante<b id="cr">${Math.ceil(S.left)}s</b></div></div>`+head()+`<div class="card"><div class="bar"><i id="tb" style="width:${S.left/LIM()*100}%;background:var(--er)"></i></div><h2>${q.q}</h2>`+
  (q.o?q.o.map((o,k)=>`<button class="o" ${S.ans?"disabled":""} onclick="pick(${k})"><b>${LET[k]})</b> ${o}</button>`).join(""):
  `<p class="crit">Critérios: atenda ao menos <b>${need(q)}</b> de <b>${q.g.length}</b>. Atendidos: <b id="cc">${grade(q,S.txt).h}</b> <span id="fm" class="fm"></span></p><textarea id="ans" rows="7" ${S.ans?"disabled":""} placeholder="Digite sua resposta (Ctrl+Enter envia)" oninput="crit()" onkeydown="if(event.ctrlKey&&event.key=='Enter')sendD()">${esc(S.txt)}</textarea>${S.ans?"":`<button class="b" onclick="sendD()">Enviar resposta</button>`}`)+`<div id="fb" class="fb"></div></div>`;
}
function crit(){
  const q=G[S.p][S.i],a=document.getElementById("ans"),c=document.getElementById("cc"),f=document.getElementById("fm");if(!a||!c)return;
  const r=grade(q,a.value);c.textContent=r.h;c.style.color=r.h>=need(q)?"var(--ok)":"inherit";
  if(f){f.textContent=a.value.trim()?(r.sf?"· ✔ formato de frase ok":"· ⚠ "+r.why):"";f.style.color=r.sf?"var(--ok)":"var(--er)"}
}
function upd(){
  const g=id=>document.getElementById(id),L=S.left,c=Math.ceil(L);
  if(g("cr"))g("cr").textContent=c+"s";
  if(g("ct"))g("ct").textContent=fmt(S.ans?S.time:S.time+(LIM()-L));
  if(g("tb"))g("tb").style.width=(L/LIM()*100)+"%";
  let d=g("cd");
  if(!S.ans&&L>0&&c<=3){if(!d){d=document.createElement("div");d.id="cd";d.className="cd";document.body.appendChild(d)}d.textContent=c}else if(d)d.remove();
}
function startT(){
  clearInterval(tmr);S.t0=Date.now();S.left=LIM();S.w=0;S.c=99;
  tmr=setInterval(()=>{
    S.left=Math.max(0,LIM()-(Date.now()-S.t0)/1000);upd();
    const c=Math.ceil(S.left);
    if(S.left<=10&&!S.w){S.w=1;SFX.warn()}
    if(c<=3&&c>0&&c!=S.c){S.c=c;SFX.tick()}
    if(S.left<=0){G[S.p][S.i].o?pick(-1):sendD()}
  },200);
}
function nq(){S.view="q";S.ans=false;S.txt="";S.left=LIM();show();startT();const a=document.getElementById("ans");if(a)a.focus()}
function done(ok,html){
  S.time+=Math.min(LIM(),(Date.now()-S.t0)/1000);S.ans=true;S.tot++;
  if(ok){
    S.score++;S.hits++;S.st++;SFX.ok();
    if(S.st%10==0){
      if(S.lives<V){S.lives++;html+="<br>🔥 10 acertos seguidos! Você ganhou 1 vida de volta."}
      else if(S.lives==V){S.lives++;html+="<br>🔥 10 acertos seguidos! Vidas cheias: você ganhou um 🛡️ escudo (vida extra)."}
      else html+="<br>🔥 10 acertos seguidos! O escudo já está ativo (máximo de 1).";
      setTimeout(SFX.life,350);
    }
  }else{S.st=0;S.lives--;S.lives==0?SFX.lose():SFX.err()}
  show();upd();
  document.getElementById("fb").innerHTML=html+`<br><button class="b" onclick="next()">Continuar</button>`;
}
function pick(k){
  if(S.ans)return;clearInterval(tmr);
  const q=G[S.p][S.i],ok=k>=0&&q.o[k]==q.a;
  done(ok,(ok?"✅ Correto! +1 ponto.":(k<0?"⏰ Tempo esgotado. ":"❌ ")+"Resposta: <b>"+LET[q.o.indexOf(q.a)]+") "+q.a+"</b>"));
  document.querySelectorAll(".o").forEach((b,j)=>{if(q.o[j]==q.a)b.classList.add("ok");else if(j==k)b.classList.add("er")});
}
function sendD(){
  if(S.ans)return;clearInterval(tmr);
  const a=document.getElementById("ans"),q=G[S.p][S.i];
  S.txt=a?a.value:"";
  const r=grade(q,S.txt);
  done(r.ok,(r.ok?"✅ Resposta aceita! +1 ponto. ":(r.sf?"❌ Resposta insuficiente. ":"❌ "+r.why+" "))+`Critérios atendidos: ${r.h} de ${r.n} (mínimo ${need(q)}).`+(r.miss.length?` Faltou citar algo sobre: <i>${esc(r.miss.join(", "))}</i>.`:"")+`<br><b>Resposta modelo:</b> ${esc(q.m)}`);
}
function next(){
  if(S.lives==0){S.view="end";return show()}
  S.i++;
  if(S.i>9){if(S.p==4){S.won=true;S.view="end";SFX.win()}else S.view="phase";return show()}
  nq();
}
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t=="dark":matchMedia("(prefers-color-scheme: dark)").matches};
function ic(){document.getElementById("tg").textContent=isDark()?"☀️":"🌙"}
function tgl(){const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("th",t)}catch(e){}ic()}
try{const t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t}catch(e){}
ic();show();loadRank();
</script>
</body>
</html>
